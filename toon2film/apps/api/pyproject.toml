[project]
name = "toon2film-api"
version = "0.1.0"
description = "FastAPI backend for Toon2Film"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "boto3>=1.35.90",
  "celery[redis]>=5.4.0",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "opencv-python-headless>=4.10.0.84",
  "pillow>=11.0.0",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.1",
  "pymupdf>=1.25.1",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14.1",
  "pytest>=8.3.4",
  "ruff>=0.8.6"
]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
