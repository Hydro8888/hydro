<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회의실 예약 시스템</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 30px 20px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  .header { text-align: center; color: #fff; margin-bottom: 30px; }
  .header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .header p { font-size: 0.95rem; opacity: 0.85; }

  .form-card {
    background: #fff; border-radius: 16px; padding: 28px 32px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12); margin-bottom: 28px;
  }
  .form-card h2 { font-size: 1.15rem; color: #4a4a6a; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
  }
  .form-group { display: flex; flex-direction: column; }
  .form-group label {
    font-size: 0.82rem; font-weight: 600; color: #6b6b8d;
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .form-group select, .form-group input {
    padding: 11px 14px; border: 2px solid #e8e8f0; border-radius: 10px;
    font-size: 0.95rem; color: #333; transition: border-color 0.2s;
    outline: none; background: #fafaff;
  }
  .form-group select:focus, .form-group input:focus { border-color: #667eea; background: #fff; }

  .time-row { display: flex; align-items: center; gap: 6px; }
  .time-row select {
    padding: 11px 10px; border: 2px solid #e8e8f0; border-radius: 10px;
    font-size: 0.95rem; color: #333; outline: none; background: #fafaff;
    transition: border-color 0.2s; flex: 1; min-width: 70px;
  }
  .time-row select:focus { border-color: #667eea; background: #fff; }
  .time-sep { font-size: 1.1rem; font-weight: 700; color: #8888a8; }

  .btn-row { display: flex; justify-content: flex-end; margin-top: 20px; gap: 10px; }
  .btn {
    padding: 11px 28px; border: none; border-radius: 10px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    box-shadow: 0 4px 15px rgba(102,126,234,0.35);
  }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(102,126,234,0.5); }
  .btn-reset { background: #f0f0f5; color: #6b6b8d; }
  .btn-reset:hover:not(:disabled) { background: #e4e4ed; }

  .room-section { margin-bottom: 10px; }
  .tabs { display: flex; gap: 0; margin-bottom: 0; }
  .tab-btn {
    flex: 1; padding: 14px 20px; background: rgba(255,255,255,0.55);
    border: none; font-size: 1rem; font-weight: 600; color: #6b6b8d;
    cursor: pointer; transition: all 0.25s; border-radius: 14px 14px 0 0;
  }
  .tab-btn.active { background: #fff; color: #667eea; box-shadow: 0 -4px 15px rgba(0,0,0,0.06); }
  .tab-btn .badge {
    display: inline-block; background: #667eea; color: #fff;
    font-size: 0.72rem; padding: 2px 8px; border-radius: 20px; margin-left: 6px;
  }
  .tab-btn.active .badge { background: #764ba2; }

  .tab-content {
    background: #fff; border-radius: 0 0 16px 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12); overflow: hidden;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: #f6f6fb; padding: 13px 16px; text-align: left;
    font-size: 0.82rem; font-weight: 700; color: #8888a8;
    text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #ededf5;
  }
  tbody td { padding: 13px 16px; font-size: 0.93rem; color: #444; border-bottom: 1px solid #f0f0f5; }
  tbody tr:hover { background: #f9f9ff; }
  .no-data { text-align: center; padding: 50px 20px; color: #b0b0c8; font-size: 0.95rem; }
  .no-data .icon { font-size: 2.5rem; margin-bottom: 10px; }

  .btn-delete {
    padding: 6px 16px; background: #ffe5e5; color: #e04040; border: none;
    border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .btn-delete:hover:not(:disabled) { background: #e04040; color: #fff; }
  .btn-delete:disabled { opacity: 0.5; cursor: not-allowed; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .stat-card {
    background: rgba(255,255,255,0.92); border-radius: 14px;
    padding: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.06);
  }
  .stat-card .num { font-size: 1.8rem; font-weight: 700; color: #667eea; }
  .stat-card .label { font-size: 0.8rem; color: #8888a8; margin-top: 4px; font-weight: 600; }

  .filter-bar {
    display: flex; align-items: center; gap: 12px; padding: 16px 20px;
    background: #f9f9ff; border-bottom: 1px solid #ededf5; flex-wrap: wrap;
  }
  .filter-bar label { font-size: 0.85rem; font-weight: 600; color: #6b6b8d; }
  .filter-bar input {
    padding: 8px 12px; border: 2px solid #e8e8f0; border-radius: 8px;
    font-size: 0.9rem; outline: none;
  }
  .filter-bar input:focus { border-color: #667eea; }
  .btn-sm {
    padding: 8px 16px; border: none; border-radius: 8px;
    font-size: 0.82rem; font-weight: 600; cursor: pointer; background: #667eea; color: #fff;
  }
  .btn-sm:hover { background: #5a6fd6; }
  .btn-sm.outline { background: transparent; color: #667eea; border: 1.5px solid #667eea; }

  .time-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; }
  .time-upcoming { background: #e8f5e9; color: #2e7d32; }
  .time-past { background: #f5f5f5; color: #999; }
  .time-ongoing { background: #fff3e0; color: #e65100; }

  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: #333; color: #fff; padding: 12px 22px; border-radius: 10px;
    font-size: 0.95rem; box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    opacity: 0; transition: opacity 0.25s, transform 0.25s;
    pointer-events: none; z-index: 9999; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 6px); }
  .toast.err { background: #d93939; }
  .toast.ok  { background: #2e7d32; }

  .footer { text-align: center; color: rgba(255,255,255,0.5); font-size: 0.78rem; margin-top: 30px; }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr 1fr; }
    .header h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🏢 회의실 예약 시스템</h1>
    <p>서초회의실 · 신사회의실 · 서버 DB 저장</p>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="num" id="statTotal">0</div><div class="label">전체 예약</div></div>
    <div class="stat-card"><div class="num" id="statRoom1">0</div><div class="label">서초회의실</div></div>
    <div class="stat-card"><div class="num" id="statRoom2">0</div><div class="label">신사회의실</div></div>
    <div class="stat-card"><div class="num" id="statToday">0</div><div class="label">오늘 예약</div></div>
  </div>

  <div class="form-card">
    <h2>📝 새 예약 등록</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>회의실</label>
        <select id="room">
          <option value="서초회의실">서초회의실</option>
          <option value="신사회의실">신사회의실</option>
        </select>
      </div>
      <div class="form-group">
        <label>날짜</label>
        <input type="date" id="date">
      </div>
      <div class="form-group">
        <label>시작 시간</label>
        <div class="time-row">
          <select id="startHour"></select>
          <span class="time-sep">:</span>
          <select id="startMin"></select>
        </div>
      </div>
      <div class="form-group">
        <label>종료 시간</label>
        <div class="time-row">
          <select id="endHour"></select>
          <span class="time-sep">:</span>
          <select id="endMin"></select>
        </div>
      </div>
      <div class="form-group">
        <label>예약 인원</label>
        <input type="number" id="people" min="1" max="50" placeholder="인원 수">
      </div>
      <div class="form-group">
        <label>예약자</label>
        <input type="text" id="reserver" placeholder="이름 입력" maxlength="50">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-reset" id="btnReset">초기화</button>
      <button class="btn btn-primary" id="btnSubmit">✅ 예약 등록</button>
    </div>
  </div>

  <div class="room-section">
    <div class="tabs">
      <button class="tab-btn active" data-tab="all"   id="tabAll">📋 전체 <span class="badge" id="badgeAll">0</span></button>
      <button class="tab-btn"        data-tab="room1" id="tabRoom1">🟦 서초회의실 <span class="badge" id="badgeRoom1">0</span></button>
      <button class="tab-btn"        data-tab="room2" id="tabRoom2">🟧 신사회의실 <span class="badge" id="badgeRoom2">0</span></button>
    </div>
    <div class="tab-content">
      <div class="filter-bar">
        <label>📅 날짜 필터 :</label>
        <input type="date" id="filterDate">
        <button class="btn-sm" id="btnFilter">검색</button>
        <button class="btn-sm outline" id="btnFilterClear">전체 보기</button>
        <button class="btn-sm outline" id="btnRefresh">🔄 새로고침</button>
      </div>

      <div class="tab-panel active" id="panelAll">
        <div class="table-wrap">
          <table><thead><tr>
            <th>No.</th><th>회의실</th><th>날짜</th><th>시간</th><th>인원</th><th>예약자</th><th>상태</th><th>관리</th>
          </tr></thead><tbody id="tableAll"></tbody></table>
          <div class="no-data" id="noDataAll"><div class="icon">📭</div>예약 내역이 없습니다.</div>
        </div>
      </div>
      <div class="tab-panel" id="panelRoom1">
        <div class="table-wrap">
          <table><thead><tr>
            <th>No.</th><th>날짜</th><th>시간</th><th>인원</th><th>예약자</th><th>상태</th><th>관리</th>
          </tr></thead><tbody id="tableRoom1"></tbody></table>
          <div class="no-data" id="noDataRoom1"><div class="icon">📭</div>서초회의실 예약 내역이 없습니다.</div>
        </div>
      </div>
      <div class="tab-panel" id="panelRoom2">
        <div class="table-wrap">
          <table><thead><tr>
            <th>No.</th><th>날짜</th><th>시간</th><th>인원</th><th>예약자</th><th>상태</th><th>관리</th>
          </tr></thead><tbody id="tableRoom2"></tbody></table>
          <div class="no-data" id="noDataRoom2"><div class="icon">📭</div>신사회의실 예약 내역이 없습니다.</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">회의실 예약 시스템 v2.0 · 데이터는 서버 DB(SQLite)에 저장됩니다.</div>
</div>

<div class="toast" id="toast"></div>

<script>
  const ROOM1 = '서초회의실';
  const ROOM2 = '신사회의실';
  // 상대경로. /room/ 하위에서 서빙되므로 fetch("api/...") 는 /room/api/... 로 감.
  const API_BASE = 'api';

  let reservations = [];
  let filterDateVal = '';

  const $ = (id) => document.getElementById(id);

  function toast(msg, kind) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast show ' + (kind || '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.className = 'toast'; }, 3000);
  }

  async function apiFetch(pathRel, opts) {
    const res = await fetch(`${API_BASE}/${pathRel}`, {
      headers: { 'Content-Type': 'application/json' },
      ...(opts || {}),
    });
    let data = null;
    try { data = await res.json(); } catch { /* non-json */ }
    if (!res.ok) {
      const msg = (data && data.error) || `HTTP ${res.status}`;
      const err = new Error(msg);
      err.status = res.status;
      err.data = data;
      throw err;
    }
    return data;
  }

  function populateTimeSelects() {
    ['startHour', 'endHour'].forEach((id) => {
      const sel = $(id);
      sel.innerHTML = '<option value="" disabled selected>시</option>';
      for (let h = 0; h < 24; h++) {
        const v = String(h).padStart(2, '0');
        sel.insertAdjacentHTML('beforeend', `<option value="${v}">${v}시</option>`);
      }
    });
    ['startMin', 'endMin'].forEach((id) => {
      const sel = $(id);
      sel.innerHTML = '<option value="" disabled selected>분</option>';
      for (let m = 0; m < 60; m += 10) {
        const v = String(m).padStart(2, '0');
        sel.insertAdjacentHTML('beforeend', `<option value="${v}">${v}분</option>`);
      }
    });
  }

  function getTimeStr(hourId, minId) {
    const h = $(hourId).value;
    const m = $(minId).value;
    if (!h || !m) return '';
    return `${h}:${m}`;
  }

  function resetForm() {
    $('room').value = ROOM1;
    $('date').valueAsDate = new Date();
    $('startHour').selectedIndex = 0;
    $('startMin').selectedIndex = 0;
    $('endHour').selectedIndex = 0;
    $('endMin').selectedIndex = 0;
    $('people').value = '';
    $('reserver').value = '';
  }

  async function loadReservations() {
    try {
      reservations = await apiFetch('reservations');
      render();
    } catch (e) {
      toast(`예약 목록 로드 실패: ${e.message}`, 'err');
      reservations = [];
      render();
    }
  }

  async function addReservation() {
    const payload = {
      room: $('room').value,
      date: $('date').value,
      startTime: getTimeStr('startHour', 'startMin'),
      endTime:   getTimeStr('endHour', 'endMin'),
      people:    $('people').value,
      reserver:  $('reserver').value.trim(),
    };
    if (!payload.date || !payload.startTime || !payload.endTime || !payload.people || !payload.reserver) {
      toast('모든 항목을 입력해 주세요 (시, 분 모두 선택)', 'err');
      return;
    }

    const btn = $('btnSubmit');
    btn.disabled = true;
    try {
      await apiFetch('reservations', {
        method: 'POST',
        body: JSON.stringify(payload),
      });
      toast('예약이 등록되었습니다', 'ok');
      resetForm();
      await loadReservations();
    } catch (e) {
      toast(e.message || '예약 등록 실패', 'err');
    } finally {
      btn.disabled = false;
    }
  }

  async function deleteReservation(id, btnEl) {
    if (!confirm('이 예약을 삭제하시겠습니까?')) return;
    if (btnEl) btnEl.disabled = true;
    try {
      await apiFetch(`reservations/${id}`, { method: 'DELETE' });
      toast('삭제되었습니다', 'ok');
      await loadReservations();
    } catch (e) {
      toast(e.message || '삭제 실패', 'err');
      if (btnEl) btnEl.disabled = false;
    }
  }

  function getStatus(date, startTime, endTime) {
    const now = new Date();
    const start = new Date(`${date}T${startTime}`);
    const end   = new Date(`${date}T${endTime}`);
    if (now < start) return { label: '예정',  cls: 'time-upcoming' };
    if (now <= end)  return { label: '진행중', cls: 'time-ongoing' };
    return { label: '종료', cls: 'time-past' };
  }

  function formatDate(d) {
    const dt = new Date(`${d}T00:00:00`);
    const days = ['일','월','화','수','목','금','토'];
    return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')} (${days[dt.getDay()]})`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.tab-panel').forEach((p) => {
      const id = p.id.replace('panel', '').toLowerCase();
      const isActive =
        (tab === 'all'   && p.id === 'panelAll') ||
        (tab === 'room1' && p.id === 'panelRoom1') ||
        (tab === 'room2' && p.id === 'panelRoom2');
      p.classList.toggle('active', isActive);
    });
  }

  function rowHTML(r, idx, withRoom) {
    const st = getStatus(r.date, r.startTime, r.endTime);
    const reserverHtml = `<strong>${escapeHtml(r.reserver)}</strong>`;
    const roomCol = withRoom
      ? `<td><span style="color:${r.room === ROOM1 ? '#667eea' : '#e67e22'};font-weight:700">${escapeHtml(r.room)}</span></td>`
      : '';
    return `<tr>
      <td>${idx+1}</td>
      ${roomCol}
      <td>${formatDate(r.date)}</td>
      <td>${escapeHtml(r.startTime)} ~ ${escapeHtml(r.endTime)}</td>
      <td>${r.people}명</td>
      <td>${reserverHtml}</td>
      <td><span class="time-badge ${st.cls}">${st.label}</span></td>
      <td><button class="btn-delete" data-id="${r.id}">🗑 삭제</button></td>
    </tr>`;
  }

  function render() {
    let data = [...reservations];
    if (filterDateVal) data = data.filter((r) => r.date === filterDateVal);

    const all   = data;
    const room1 = data.filter((r) => r.room === ROOM1);
    const room2 = data.filter((r) => r.room === ROOM2);

    const today = new Date().toISOString().slice(0, 10);
    $('statTotal').textContent = reservations.length;
    $('statRoom1').textContent = reservations.filter((r) => r.room === ROOM1).length;
    $('statRoom2').textContent = reservations.filter((r) => r.room === ROOM2).length;
    $('statToday').textContent = reservations.filter((r) => r.date === today).length;

    $('badgeAll').textContent   = all.length;
    $('badgeRoom1').textContent = room1.length;
    $('badgeRoom2').textContent = room2.length;

    $('tableAll').innerHTML   = all.map((r, i)   => rowHTML(r, i, true)).join('');
    $('tableRoom1').innerHTML = room1.map((r, i) => rowHTML(r, i, false)).join('');
    $('tableRoom2').innerHTML = room2.map((r, i) => rowHTML(r, i, false)).join('');

    $('noDataAll').style.display   = all.length   ? 'none' : 'block';
    $('noDataRoom1').style.display = room1.length ? 'none' : 'block';
    $('noDataRoom2').style.display = room2.length ? 'none' : 'block';
  }

  // Wiring
  populateTimeSelects();
  $('date').valueAsDate = new Date();

  $('btnSubmit').addEventListener('click', addReservation);
  $('btnReset').addEventListener('click', resetForm);
  $('btnRefresh').addEventListener('click', loadReservations);
  $('btnFilter').addEventListener('click', () => { filterDateVal = $('filterDate').value; render(); });
  $('btnFilterClear').addEventListener('click', () => { filterDateVal = ''; $('filterDate').value = ''; render(); });
  document.querySelectorAll('.tab-btn').forEach((b) =>
    b.addEventListener('click', () => switchTab(b.dataset.tab))
  );
  // Event delegation for delete buttons
  document.querySelector('.tab-content').addEventListener('click', (e) => {
    const btn = e.target.closest('.btn-delete');
    if (!btn) return;
    const id = parseInt(btn.dataset.id, 10);
    if (Number.isFinite(id)) deleteReservation(id, btn);
  });

  loadReservations();
</script>
</body>
</html>
