user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;

    # HTTP server — /jobworld 서브패스 기준
    server {
        listen 80 default_server;
        server_name _;

        # API: /jobworld/api/ → backend:8000/api/ (prefix 제거)
        location /jobworld/api/ {
            rewrite ^/jobworld(/api/.*)$ $1 break;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check
        location /jobworld/health {
            proxy_pass http://backend:8000/health;
        }

        # Admin
        location /jobworld/admin.html {
            alias /usr/share/nginx/html/admin.html;
        }

        # Frontend: /jobworld/ → frontend:3000 (Next.js basePath: '/jobworld')
        location /jobworld {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
