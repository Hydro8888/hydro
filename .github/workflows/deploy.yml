name: JobWorld Deploy

on:
  push:
    branches:
      - claude/import-jobworld-project-zvwke
      - main
    paths:
      - 'jobworld/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 211.198.54.207
          port: 2222
          username: ubuntu
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          script: |
            set -e
            echo "=== JobWorld 배포 시작 ==="

            BRANCH="claude/import-jobworld-project-zvwke"

            # 코드 클론/업데이트
            if [ ! -d "/home/ubuntu/hydro/.git" ]; then
              git clone --branch "$BRANCH" https://github.com/Hydro8888/hydro.git /home/ubuntu/hydro
            else
              cd /home/ubuntu/hydro
              git fetch origin "$BRANCH"
              git checkout "$BRANCH"
              git pull origin "$BRANCH"
            fi

            cd /home/ubuntu/hydro/jobworld

            # .env 확인
            if [ ! -f .env ]; then
              echo "ERROR: .env 파일이 없습니다. 먼저 server_setup.sh를 실행하세요."
              exit 1
            fi

            # 빌드 및 실행
            docker compose build --no-cache frontend backend
            docker compose up -d

            # 헬스체크
            sleep 15
            docker compose ps

            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:3100/jobworld/health > /dev/null 2>&1; then
                echo "=== 배포 성공! ==="
                exit 0
              fi
              echo "헬스체크 대기... ($i/5)"
              sleep 5
            done

            echo "헬스체크 실패"
            docker compose logs --tail=30
            exit 1
