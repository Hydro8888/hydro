# Simburum nginx location block
# Docker nginx (jobworld-nginx) 설정에 추가할 블록
# default.conf 또는 해당 server 블록에 추가

location /simburum {
    proxy_pass http://172.17.0.1:4200;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400;
}

location /simburum/_next/static {
    proxy_pass http://172.17.0.1:4200/simburum/_next/static;
    proxy_cache_bypass $http_upgrade;
    expires 365d;
    add_header Cache-Control "public, immutable";
}
