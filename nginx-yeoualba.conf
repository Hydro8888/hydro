# ============================================================
# YeouAlba - Docker nginx (jobworld-nginx) 추가 설정
# ============================================================
# 이 파일의 내용을 jobworld-nginx 컨테이너의
# /etc/nginx/conf.d/default.conf 에 추가하세요.
#
# 적용 방법:
#   1. docker exec jobworld-nginx cat /etc/nginx/conf.d/default.conf > /tmp/default.conf
#   2. 이 파일의 location 블록을 /tmp/default.conf의 server {} 안에 추가
#   3. docker cp /tmp/default.conf jobworld-nginx:/etc/nginx/conf.d/default.conf
#   4. docker exec jobworld-nginx nginx -t
#   5. docker exec jobworld-nginx nginx -s reload
# ============================================================

# ===== YeouAlba API (백엔드) =====
# /yeoualba/api/* → 호스트 PM2 백엔드 (포트 5001)
location /yeoualba/api/ {
    proxy_pass http://172.17.0.1:5001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# ===== YeouAlba Socket.io (실시간 통신) =====
location /yeoualba/socket.io/ {
    proxy_pass http://172.17.0.1:5001/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# ===== YeouAlba Frontend (Next.js) =====
# /yeoualba/* → 호스트 PM2 프론트엔드 (포트 3004)
# 주의: basePath=/yeoualba 가 Next.js에 설정되어 있으므로
#       proxy_pass에도 /yeoualba/ 경로를 유지해야 함
location /yeoualba/ {
    proxy_pass http://172.17.0.1:3004/yeoualba/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# ===== YeouAlba Next.js 정적 자원 =====
location /yeoualba/_next/ {
    proxy_pass http://172.17.0.1:3004/yeoualba/_next/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_valid 200 30d;
    add_header Cache-Control "public, immutable";
}
