<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Subtle inner glow -->
  <rect x="48" y="48" width="416" height="416" rx="88" ry="88" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  <!-- AI text -->
  <text x="256" y="300" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="220" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-8">AI</text>
  <!-- Sparkle dot (top-right) -->
  <circle cx="390" cy="120" r="18" fill="rgba(255,255,255,0.9)"/>
  <circle cx="390" cy="120" r="8" fill="white"/>
</svg>
